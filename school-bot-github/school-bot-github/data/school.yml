  year: 3                 # Year 3
  number: 1               # Semester 1
  start: 2026-09-14       # Monday of week 1  (write it like YYYY-MM-DD)
  weeks: 16               # how many weeks in the semester

# ---------------------------------------------------------------- projector
# Groups take turns automatically, one group per week, in this order.
projector:
  teams:
    - Group 1
    - Group 2
    - Group 3
    - Group 4
    - Group 5
    - Group 6
    - Group 7
    - Group 8
  rotation_start: 2026-09-14    # the week of this date uses the FIRST team
  # Need to change one week?  Add a line like this (date = any day of that week):
  overrides:
    # 2026-10-19: Group 4

